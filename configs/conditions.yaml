# Team conditions (Table I of the paper). Each is one setting of the scheduler's three parts:
#   allocation   how robots get frontiers and tasks:
#                  brain     the VLM ranks frontiers and proposes tasks from evidence-backed menus; Hungarian
#                            assignment routes the robots (ours)
#                  direct    the VLM assigns every robot's frontier or task itself (Co-NavGPT style)
#                  geometric pure geometric assignment, no VLM scheduler
#                  jev       the judge ranks the frontiers instead of the VLM (optional variant)
#   drone_local / dog_local   who takes each robot's candidate decisions:
#                  jev   the calibrated judge with the two-key commitment gates
#                  rule  detector-score and verifier-answer rules
#                  vlm   the VLM, asked locally (optional variant)
#   clock        charged: every model call costs its measured latency on the mission clock; free: the world waits
ours:                   {allocation: brain,     drone_local: jev,  dog_local: jev,  clock: charged}
frontier_rules:         {allocation: geometric, drone_local: rule, dog_local: rule, clock: charged}
vlm_direct:             {allocation: direct,    drone_local: jev,  dog_local: jev,  clock: charged}
wo_gates:               {allocation: brain,     drone_local: rule, dog_local: rule, clock: charged}
wo_semantic_scheduler:  {allocation: geometric, drone_local: jev,  dog_local: jev,  clock: charged}
gates_legged_only:      {allocation: brain,     drone_local: rule, dog_local: jev,  clock: charged}
gates_drones_only:      {allocation: brain,     drone_local: jev,  dog_local: rule, clock: charged}
latency_free:           {allocation: brain,     drone_local: jev,  dog_local: jev,  clock: free}
judge_ranking:          {allocation: jev,       drone_local: jev,  dog_local: jev,  clock: charged}
