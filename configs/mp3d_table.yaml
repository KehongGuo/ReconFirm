# Table I and the ablations: 50 missions in 10 held-out Matterport3D buildings, 300 s each, every condition, one pass.
# The two largest buildings' sim does not fit beside the VLM server on a 16 GB card: run them with the server on one
# GPU and gpu=<the other> ("scenes=[r1Q1Z4BcV1o,uNb9QFRL6hY]"), the rest with skip_scenes.
base: default.yaml
experiment: mp3d_table
dataset: mp3d
episodes: data/episodes/team_episodes_v2_test.json
conditions: [ours, frontier_rules, vlm_direct, ours_semantic, gates_legged_only, gates_drones_only, latency_free]
passes: 1
mission_s: 300
